name: Town sign visual check
on:
  push:
    paths:
      - '.github/workflows/town-sign-visual-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser tools
        run: |
          mkdir -p /tmp/town-sign-check
          cd /tmp/town-sign-check
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Check deployed layout and changing town search
        run: |
          mkdir -p visual-check
          node --check dist/sr-image-quality.js
          cat > /tmp/town-sign-check/check.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const assert = require('assert');
          const out = path.resolve(process.env.GITHUB_WORKSPACE, 'visual-check');
          const release = '6bf37c78ac8d6b223d6f0f3b9c207b5b5081942f';
          const reports = [];
          const errors = [];
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: {width:1440,height:1050}, deviceScaleFactor:1 });
            page.on('pageerror', e => errors.push(String(e)));
            async function record(name) {
              await page.evaluate(() => document.fonts.ready);
              await page.waitForTimeout(1200);
              const data = await page.evaluate(() => {
                const roots = [document];
                for (const root of roots) {
                  for (const e of root.querySelectorAll('*')) if (e.shadowRoot) roots.push(e.shadowRoot);
                  const sign = root.querySelector('.town-banner-sign');
                  if (!sign) continue;
                  const hero = sign.parentElement;
                  const box = e => { const b=e.getBoundingClientRect(); return {x:b.x,y:b.y,width:b.width,height:b.height,bottom:b.bottom,right:b.right}; };
                  return {
                    url:location.href,
                    width:innerWidth,
                    title:sign.querySelector('.town-banner-town').textContent,
                    signs:root.querySelectorAll('.town-banner-sign').length,
                    fontLoaded:[...document.fonts].some(f=>f.family.replace(/["']/g,'')==='Permanent Marker' && f.status==='loaded'),
                    titleTransform:getComputedStyle(sign.querySelector('.town-banner-title')).transform,
                    strapTransform:getComputedStyle(sign.querySelector('.town-banner-strapline')).transform,
                    descriptionTransform:getComputedStyle(sign.querySelector('.town-banner-description')).transform,
                    description:box(sign.querySelector('.town-banner-description')),
                    sign:box(sign),
                    search:box(hero.querySelector('.hero-form')),
                    photo:hero.querySelector('img').src,
                    photoAlt:hero.querySelector('img').alt,
                    photoLoaded:hero.querySelector('img').naturalWidth>0,
                    overflow:document.documentElement.scrollWidth>innerWidth,
                    scripts:[...document.scripts].map(s=>s.src).filter(s=>s.includes('sr-image-quality.js'))
                  };
                }
                return {error:'No town sign found',url:location.href};
              });
              reports.push({name,...data});
              await page.screenshot({path:path.join(out,name+'.png')});
              assert(!data.error,data.error);
              assert(data.scripts.some(s=>s.includes(release)),'Expected deployed release');
              assert(data.fontLoaded,'Brush font must load');
              assert(data.signs===1,'Only one sign');
              assert(data.titleTransform===data.strapTransform && data.strapTransform===data.descriptionTransform,'Text lines must be parallel');
              assert(data.description.bottom<=data.search.y+1,'Search must not cover description');
              assert(data.sign.bottom>data.search.y && data.sign.right>data.search.x,'Search must overlap lower board');
              assert(data.photoLoaded,'Town photo must load');
              assert(!data.overflow,'No horizontal page overflow');
              return data;
            }
            try {
              for(let attempt=0;attempt<3;attempt++) {
                await page.goto('https://www.spin-raiders.com/destination/cromer?signcheck='+release+'-'+attempt,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForTimeout(12000);
                if(await page.evaluate(r=>[...document.scripts].some(s=>s.src.includes(r)),release)) break;
              }
              const decline=page.getByRole('button',{name:'Decline All',exact:true});
              if(await decline.count()) await decline.first().click({timeout:3000}).catch(()=>{});
              const first=await record('live-cromer-desktop');
              assert(first.title==='Cromer');
              await page.setViewportSize({width:390,height:1000});
              await record('live-cromer-mobile');
              await page.setViewportSize({width:1440,height:1050});
              const input=page.locator('#search-query');
              await input.fill('Blackpool');
              await input.press('Enter');
              await page.locator('.town-banner-town').filter({hasText:'Blackpool'}).waitFor({timeout:45000});
              const changed=await record('live-blackpool-search');
              assert(changed.title==='Blackpool');
              assert(changed.photo!==first.photo,'Town search must change the photograph');
            } catch(e) {
              errors.push(String(e));
              await page.screenshot({path:path.join(out,'failure.png')}).catch(()=>{});
              process.exitCode=1;
            } finally {
              fs.writeFileSync(path.join(out,'verification.json'),JSON.stringify({release,reports,errors},null,2));
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/town-sign-check/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: town-sign-live-verification
          path: visual-check/
          retention-days: 1
