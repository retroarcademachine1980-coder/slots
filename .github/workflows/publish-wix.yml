name: Publish Wix site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wix-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
    steps:
      - name: Check Wix deployment key
        id: key
        shell: bash
        run: |
          if [ -z "$WIX_CLI_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WIX_CLI_API_KEY is not configured."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Authenticate Wix CLI for Sites
        run: npm run wix login -- --api-key "$WIX_CLI_API_KEY"

      - name: Install expect
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect

      - name: Publish checked-out code
        env:
          CI: "true"
        run: |
          timeout 300s expect <<'EOF'
          log_user 1
          set timeout 240
          spawn npm run wix publish
          expect {
            -re {What would you like to publish\?} {
              send -- "\033\[B"
              after 250
              send -- "\r"
              exp_continue
            }
            -re {Continue with publish\?} {
              send -- "y\r"
              exp_continue
            }
            -re {Are you sure.*\?} {
              send -- "y\r"
              exp_continue
            }
            eof {
              catch wait result
              exit [lindex $result 3]
            }
            timeout {
              send -- "\003"
              exit 124
            }
          }
          EOF
