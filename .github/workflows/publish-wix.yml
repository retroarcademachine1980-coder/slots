name: Publish Wix site

# DISABLED on push (28 Sep 2026): `wix publish` from CI builds a branch off an OLD
# saved revision (5616, the old casino site) and makes it live, so every push to main
# took the real site down (all venue/town/search pages 404). Site code is served from
# jsDelivr via the loader embed, so no publish is needed for dist/ changes.
# Only run this by hand if the Velo code in this repo changes AND the stale-revision
# problem has been fixed.
on:
  workflow_dispatch:

concurrency:
  group: wix-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
    steps:
      - name: Check Wix deployment key
        id: key
        shell: bash
        run: |
          if [ -z "$WIX_CLI_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WIX_CLI_API_KEY is not configured."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Authenticate Wix CLI for Sites
        run: npm run wix login -- --api-key "$WIX_CLI_API_KEY"

      - name: Publish checked-out code
        env:
          CI: "true"
        run: |
          {
            printf '\033[B\n'
            sleep 15
            printf 'y\n'
            sleep 15
            printf 'y\n'
          } | timeout 240s npm run wix publish
