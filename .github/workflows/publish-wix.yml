name: Publish Wix site

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Authenticate Wix CLI for Sites
        run: npm run wix login -- --api-key "${{ secrets.WIX_CLI_API_KEY }}"

      - name: Publish latest origin/main
        env:
          CI: "true"
        run: npm run wix publish
