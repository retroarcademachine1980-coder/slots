name: Official branch image review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-branch-review-20261006.yml'

permissions:
  contents: read

concurrency:
  group: image-branch-review-20261006
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install review dependencies
        run: python -m pip install requests beautifulsoup4 Pillow
      - name: Read selected branch names and inspect official public sources
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python tools/image_branch_sources_20261006.py
      - name: Save public image review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-branch-review-20261006
          path: branch-image-review/
          retention-days: 7
          if-no-files-found: warn
