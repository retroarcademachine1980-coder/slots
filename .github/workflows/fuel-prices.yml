name: Refresh government forecourt prices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/refresh-fuel-prices.py
      - .github/workflows/fuel-prices.yml
permissions:
  contents: write
concurrency:
  group: fuel-prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh the public government snapshot
        run: python tools/refresh-fuel-prices.py
      - name: Publish successful dated data
        run: |
          git config user.name 'Spin Raiders Listings'
          git config user.email 'cinema-listings@users.noreply.github.com'
          git add dist/fuel-prices/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh government forecourt prices'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
