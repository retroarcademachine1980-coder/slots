name: Refresh cinema showtimes
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/refresh-cinema-showtimes.py
      - .github/workflows/cinema-showtimes.yml
permissions:
  contents: write
concurrency:
  group: cinema-showtimes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Refresh authorised operator feeds
        id: refresh
        continue-on-error: true
        run: python3 tools/refresh-cinema-showtimes.py
      - name: Save successful updates
        run: |
          git config user.name 'Spin Raiders Listings'
          git config user.email 'cinema-listings@users.noreply.github.com'
          git add dist/cinema-showtimes/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh cinema screening times'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report failed sources
        if: steps.refresh.outcome == 'failure'
        run: exit 1
