<!-- Hide the obsolete Wix surface, never the body or the new page roots. -->
<script>(function(){try{var p=(location.pathname||'/').replace(/\/+$/,'')||'/';
var owned=p==='/'||/^\/(destination\/|arcade-venues\/|search$|food-and-drink\/|classic-fruit-machine-archive|seaside$|casinos$|destination-recommendations$)/.test(p);
if(!owned)return;var s=document.createElement('style');s.id='sr-hold';
s.textContent='html,body{background:#0d1928}#SITE_CONTAINER{visibility:hidden!important}';
(document.head||document.documentElement).appendChild(s);
setTimeout(function(){s.remove()},4000)}catch(e){}})();</script>
